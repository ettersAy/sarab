<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SARAB — Smart AI Request Automation Bot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="logo">&#9654;</span>
      <h1>SARAB</h1>
      <span class="badge">MVP</span>
    </div>
    <nav class="topbar-nav" id="nav">
      <button data-view="dashboard" class="nav-btn active">Dashboard</button>
      <button data-view="projects" class="nav-btn">Projects</button>
      <button data-view="queue" class="nav-btn">Queue</button>
      <button data-view="submit" class="nav-btn">New Prompt</button>
      <button data-view="kanban" class="nav-btn">Kanban</button>
      <button data-view="chatbot" class="nav-btn">Chatbot</button>
      <button data-view="settings" class="nav-btn">Settings</button>
      <a href="/wiki" class="nav-btn" style="text-decoration:none" target="_blank">Wiki &#8599;</a>
    </nav>
    <div class="topbar-status">
      <span id="queue-indicator" class="indicator running">&#9679;</span>
      <span id="queue-label">Worker</span>
    </div>
  </header>

  <main id="main"></main>

  <div id="log-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="log-title">Execution Log</h3>
        <button class="modal-close" id="log-close">&times;</button>
      </div>
      <pre id="log-body" class="log-body"></pre>
    </div>
  </div>

  <div id="ticket-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-form">
      <div class="modal-header">
        <h3 id="ticket-modal-title">Ticket</h3>
        <button class="modal-close ticket-modal-close">&times;</button>
      </div>
      <div id="ticket-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="project-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-form">
      <div class="modal-header">
        <h3 id="project-modal-title">Project</h3>
        <button class="modal-close project-modal-close">&times;</button>
      </div>
      <div id="project-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="provider-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-form">
      <div class="modal-header">
        <h3 id="provider-modal-title">Provider</h3>
        <button class="modal-close provider-modal-close">&times;</button>
      </div>
      <div id="provider-modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/js/core.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/queue.js"></script>
  <script src="/js/views/submit.js"></script>
  <script src="/js/views/projects.js"></script>
  <script src="/js/views/kanban.js"></script>
  <script src="/js/views/settings.js"></script>
  <script src="/js/views/chatbot.js"></script>
  <script src="/js/actions.js"></script>
  <script src="/js/modals.js"></script>
</body>
</html>
